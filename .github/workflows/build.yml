name: Build Nikia

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java (Android)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: npm run build:win

      - name: Build Mac
        if: matrix.os == 'macos-latest'
        run: npm run build:mac

      - name: Build Android
        if: matrix.os == 'ubuntu-latest'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: npm run build:android

      - name: Rename APK
        if: matrix.os == 'ubuntu-latest'
        run: mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/Nikia.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nikia-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
            dist/latest*.yml
            android/app/build/outputs/apk/release/Nikia.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Unified Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.blockmap
            artifacts/**/*.yml
            artifacts/**/*.apk
          draft: false

      - name: Upload Mac Releases to Cloudflare R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm install -g wrangler
          VERSION=${GITHUB_REF#refs/tags/v}
          
          # Find latest-mac.yml which might be nested (e.g. artifacts/dist/latest-mac.yml)
          YML_FILE=$(find artifacts -name "latest-mac.yml" | head -n 1)
          
          if [ -n "$YML_FILE" ]; then
            echo "Mac release files found at $YML_FILE. Uploading to R2..."
            
            # Upload ZIPs
            find artifacts -name "Nikia-*.zip" | while read file; do
              wrangler r2 object put "nikia-releases/mac/$(basename "$file")" --file "$file" --content-type application/octet-stream
            done
            
            # Upload DMGs
            find artifacts -name "Nikia-*.dmg" | while read file; do
              wrangler r2 object put "nikia-releases/mac/$(basename "$file")" --file "$file" --content-type application/octet-stream
            done
            
            # Upload latest-mac.yml
            wrangler r2 object put "nikia-releases/mac/latest-mac.yml" --file "$YML_FILE" --content-type text/yaml --cache-control no-store
            
            # Generate and upload latest.json
            ARM64_DMG=$(find artifacts -name "Nikia-*-arm64.dmg" -exec basename {} \; | head -n 1)
            X64_DMG=$(find artifacts -name "Nikia-*-x64.dmg" -exec basename {} \; | head -n 1)
            
            echo '{' > latest.json
            echo "  \"version\": \"${VERSION}\"," >> latest.json
            echo '  "assets": {' >> latest.json
            echo "    \"arm64\": \"${ARM64_DMG}\"," >> latest.json
            echo "    \"x64\": \"${X64_DMG}\"" >> latest.json
            echo '  }' >> latest.json
            echo '}' >> latest.json
            
            wrangler r2 object put "nikia-releases/mac/latest.json" --file ./latest.json --content-type application/json --cache-control no-store
            echo "R2 upload complete."
          else
            echo "No Mac release files found in artifacts. Skipping R2 upload."
          fi
