name: Build Nikia

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java (Android)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: npm run build:win

      - name: Build Mac
        if: matrix.os == 'macos-latest'
        run: npm run build:mac

      - name: Build Android
        if: matrix.os == 'ubuntu-latest'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: npm run build:android

      - name: Rename APK
        if: matrix.os == 'ubuntu-latest'
        run: mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/Nikia.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nikia-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
            dist/latest*.yml
            android/app/build/outputs/apk/release/Nikia.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Unified Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.blockmap
            artifacts/**/*.yml
            artifacts/**/*.apk
          draft: false

      - name: Upload Mac Releases to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          
          echo "--- TEST 1: Testing Credentials ---"
          aws s3 ls s3://nikia-releases/mac/ --endpoint-url $R2_ENDPOINT || echo "TEST 1 FAILED: Check your Secret Key for typos or spaces!"
          
          echo "--- TEST 2: Testing Small Upload ---"
          echo "test" > test.txt
          aws s3 cp test.txt s3://nikia-releases/mac/test.txt --endpoint-url $R2_ENDPOINT || echo "TEST 2 FAILED"
          
          set -e
          
          # Find latest-mac.yml which might be nested (e.g. artifacts/dist/latest-mac.yml)
          YML_FILE=$(find artifacts -name "latest-mac.yml" | head -n 1)
          
          if [ -n "$YML_FILE" ]; then
            echo "Mac release files found at $YML_FILE. Uploading to R2 via S3 API..."
            
            # Upload ZIPs
            find artifacts -name "Nikia-*.zip" | while read file; do
              aws s3 cp "$file" s3://nikia-releases/mac/$(basename "$file") --endpoint-url $R2_ENDPOINT --content-type application/octet-stream
            done
            
            # Upload DMGs
            find artifacts -name "Nikia-*.dmg" | while read file; do
              aws s3 cp "$file" s3://nikia-releases/mac/$(basename "$file") --endpoint-url $R2_ENDPOINT --content-type application/octet-stream
            done
            
            # Upload latest-mac.yml
            aws s3 cp "$YML_FILE" s3://nikia-releases/mac/latest-mac.yml --endpoint-url $R2_ENDPOINT --content-type text/yaml --cache-control no-store
            
            # Generate and upload latest.json
            ARM64_DMG=$(find artifacts -name "Nikia-*-arm64.dmg" -exec basename {} \; | head -n 1)
            X64_DMG=$(find artifacts -name "Nikia-*-x64.dmg" -exec basename {} \; | head -n 1)
            
            echo '{' > latest.json
            echo "  \"version\": \"${VERSION}\"," >> latest.json
            echo '  "assets": {' >> latest.json
            echo "    \"arm64\": \"${ARM64_DMG}\"," >> latest.json
            echo "    \"x64\": \"${X64_DMG}\"" >> latest.json
            echo '  }' >> latest.json
            echo '}' >> latest.json
            
            aws s3 cp latest.json s3://nikia-releases/mac/latest.json --endpoint-url $R2_ENDPOINT --content-type application/json --cache-control no-store
            echo "R2 upload complete."
          else
            echo "No Mac release files found in artifacts. Skipping R2 upload."
          fi
