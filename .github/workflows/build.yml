name: Build Nikia

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java (Android)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: npm run build:win

      - name: Build Mac
        if: matrix.os == 'macos-latest'
        run: npm run build:mac

      - name: Build Android
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:android

      - name: Rename APK
        if: matrix.os == 'ubuntu-latest'
        run: mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/Nikia.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nikia-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
            dist/latest*.yml
            android/app/build/outputs/apk/release/Nikia.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Unified Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.blockmap
            artifacts/**/*.yml
            artifacts/**/*.apk
          draft: false
