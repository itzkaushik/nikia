name: Build Nikia

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java (Android)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: npm run build:win

      - name: Build Mac
        if: matrix.os == 'macos-latest'
        run: npm run build:mac

      - name: Build Android
        if: matrix.os == 'ubuntu-latest'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: npm run build:android

      - name: Rename APK
        if: matrix.os == 'ubuntu-latest'
        run: mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/Nikia.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nikia-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
            dist/latest*.yml
            android/app/build/outputs/apk/release/Nikia.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Unified Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.blockmap
            artifacts/**/*.yml
            artifacts/**/*.apk
          draft: false

      - name: Upload Mac Releases to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -e
          VERSION=${GITHUB_REF#refs/tags/v}
          
          echo "--- DEBUG: Verifying S3 Credentials Format ---"
          AK_LEN=${#AWS_ACCESS_KEY_ID}
          SK_LEN=${#AWS_SECRET_ACCESS_KEY}
          echo "Access Key Length: $AK_LEN (Expected 32)"
          echo "Secret Key Length: $SK_LEN (Expected 64)"
          
          if [ "$SK_LEN" -ne 64 ]; then
            echo "ERROR: Your R2_SECRET_ACCESS_KEY is $SK_LEN characters long. An S3 Secret Access Key from Cloudflare MUST be exactly 64 characters."
            echo "You likely copied the 'R2 Token Value' instead of the 'Secret Access Key' under 'Credentials for S3 Clients'."
            exit 1
          fi
          
          echo "--- DEBUG: Testing Small Upload ---"
          echo "test" > test.txt
          if ! aws s3 cp test.txt s3://nikia-releases/mac/test.txt --endpoint-url $R2_ENDPOINT --region auto; then
             echo "ERROR: Small upload failed. Your credentials are fundamentally invalid or the Bucket name 'nikia-releases' doesn't match."
             exit 1
          fi
          echo "Small upload passed! Credentials are good."
          
          # Find latest-mac.yml which might be nested (e.g. artifacts/dist/latest-mac.yml)
          YML_FILE=$(find artifacts -name "latest-mac.yml" | head -n 1)
          
          if [ -n "$YML_FILE" ]; then
            echo "Mac release files found at $YML_FILE. Uploading to R2 via S3 API..."
            
            # Upload ZIPs
            find artifacts -name "Nikia-*.zip" | while read file; do
              aws s3 cp "$file" s3://nikia-releases/mac/$(basename "$file") --endpoint-url $R2_ENDPOINT --content-type application/octet-stream
            done
            
            # Upload DMGs
            find artifacts -name "Nikia-*.dmg" | while read file; do
              aws s3 cp "$file" s3://nikia-releases/mac/$(basename "$file") --endpoint-url $R2_ENDPOINT --content-type application/octet-stream
            done
            
            # Upload latest-mac.yml
            aws s3 cp "$YML_FILE" s3://nikia-releases/mac/latest-mac.yml --endpoint-url $R2_ENDPOINT --content-type text/yaml --cache-control no-store
            
            # Generate and upload latest.json
            ARM64_DMG=$(find artifacts -name "Nikia-*-arm64.dmg" -exec basename {} \; | head -n 1)
            X64_DMG=$(find artifacts -name "Nikia-*-x64.dmg" -exec basename {} \; | head -n 1)
            
            echo '{' > latest.json
            echo "  \"version\": \"${VERSION}\"," >> latest.json
            echo '  "assets": {' >> latest.json
            echo "    \"arm64\": \"${ARM64_DMG}\"," >> latest.json
            echo "    \"x64\": \"${X64_DMG}\"" >> latest.json
            echo '  }' >> latest.json
            echo '}' >> latest.json
            
            aws s3 cp latest.json s3://nikia-releases/mac/latest.json --endpoint-url $R2_ENDPOINT --content-type application/json --cache-control no-store
            echo "R2 upload complete."
          else
            echo "No Mac release files found in artifacts. Skipping R2 upload."
          fi

      - name: Clean up old R2 releases (Keep Last 2)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -e
          echo "Scanning R2 bucket for old versions..."
          
          VERSIONS=$(aws s3 ls s3://nikia-releases/mac/ --endpoint-url $R2_ENDPOINT | awk '{print $4}' | grep -oE "Nikia-[0-9]+\.[0-9]+\.[0-9]+" | sed 's/Nikia-//' | sort -V | uniq || true)
          
          if [ -z "$VERSIONS" ]; then
            echo "No versioned files found in bucket."
            exit 0
          fi
          
          VERSION_COUNT=$(echo "$VERSIONS" | wc -l)
          echo "Found $VERSION_COUNT version(s) in the bucket:"
          echo "$VERSIONS"
          
          if [ "$VERSION_COUNT" -gt 2 ]; then
            VERSIONS_TO_DELETE=$(echo "$VERSIONS" | head -n -2)
            echo "Versions marked for deletion:"
            echo "$VERSIONS_TO_DELETE"
            
            for v in $VERSIONS_TO_DELETE; do
              echo "Deleting artifacts for version $v..."
              aws s3 rm s3://nikia-releases/mac/ --recursive --exclude "*" --include "Nikia-$v-*" --endpoint-url $R2_ENDPOINT
            done
            echo "Cleanup complete!"
          else
            echo "2 or fewer versions exist. No cleanup needed."
          fi
