<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Stream - Nikia</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 20;
            transition: opacity 0.3s;
        }
        .header.hidden { opacity: 0; pointer-events: none; }
        .back-btn, .channels-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
        }
        .back-btn:hover, .channels-btn:hover { background: rgba(255,255,255,0.2); }
        .back-btn svg, .channels-btn svg { width: 18px; height: 18px; }
        .title {
            font-weight: 700;
            font-size: 1.1rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 50%;
        }
        .player-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.6);
            font-size: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 5;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #e91e8c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #errorMsg {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,60,60,0.1);
            border: 1px solid rgba(255,60,60,0.3);
            color: #ff5555;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            z-index: 5;
        }

        /* Channels Panel */
        .channels-panel {
            position: absolute;
            top: 0; right: -320px;
            width: 320px;
            height: 100%;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(10px);
            border-left: 1px solid rgba(255,255,255,0.1);
            z-index: 30;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: -5px 0 20px rgba(0,0,0,0.5);
        }
        .channels-panel.open { right: 0; }
        .channels-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
        }
        .close-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            padding: 4px;
        }
        .close-btn:hover { color: white; }
        .channels-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .channel-item {
            padding: 12px 16px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .channel-item:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
        }
        .channel-item.active {
            background: rgba(233,30,140,0.15);
            border-color: #e91e8c;
        }
        .channel-name { font-size: 0.9rem; font-weight: 600; color: white; }
        .channel-meta { font-size: 0.75rem; color: rgba(255,255,255,0.5); display: flex; gap: 8px; }
        .badge {
            background: rgba(255,255,255,0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
        }
        .badge.hd { background: #e91e8c; color: white; font-weight: 700; }
    </style>
</head>
<body>
    <div class="header" id="header">
        <button class="back-btn" onclick="window.location.href = 'index.html#sports'">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
            Back
        </button>
        <div class="title" id="streamTitle">Loading Match...</div>
        <button class="channels-btn" onclick="toggleChannels()" id="btnToggleChannels" style="display:none">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            Channels (<span id="channelCount">0</span>)
        </button>
    </div>

    <div class="channels-panel" id="channelsPanel">
        <div class="channels-header">
            Select Channel
            <button class="close-btn" onclick="toggleChannels()">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="channels-list" id="channelsList"></div>
    </div>

    <!-- Countdown Screen for Upcoming Matches -->
    <div id="countdownContainer" style="display: none; position: absolute; inset: 0; z-index: 15; background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a0f 100%); flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;">
        <div style="font-size: 3rem; margin-bottom: 16px;">⏳</div>
        <h2 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 8px;">Match Has Not Started Yet</h2>
        <p style="color: rgba(255,255,255,0.6); max-width: 450px; font-size: 0.95rem; margin-bottom: 24px; line-height: 1.5;">The live video feed will go live when the match officially starts. Please check back when the timer hits zero!</p>
        <div id="liveClock" style="font-family: monospace; font-size: 2.5rem; font-weight: 800; color: #e91e8c; background: rgba(233,30,140,0.1); border: 1px solid rgba(233,30,140,0.3); padding: 16px 32px; border-radius: 12px; margin-bottom: 24px; letter-spacing: 2px;">
            00:00:00
        </div>
        <div style="display: flex; gap: 12px;">
            <button class="back-btn" onclick="window.location.href = 'index.html#sports'" style="padding: 10px 24px;">← Back to Sports</button>
            <button class="channels-btn" id="btnForceLoad" onclick="forceLoadPlayer()" style="padding: 10px 24px;">Try Loading Player Anyway</button>
        </div>
    </div>

    <div class="player-container">
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <span id="loaderText">Fetching channels...</span>
        </div>
        <div id="errorMsg">Failed to load stream. Please try again.</div>
        <iframe id="playerFrame" allowfullscreen allow="autoplay; fullscreen"></iframe>
    </div>

    <script>
        let allStreams = [];
        let currentStreamUrl = '';
        let matchTimerInterval = null;
        const channelsPanel = document.getElementById('channelsPanel');

        function toggleChannels() {
            channelsPanel.classList.toggle('open');
        }

        async function fetchWithTimeout(url, timeout = 8000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(url, { signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (e) {
                clearTimeout(id);
                throw e;
            }
        }

        function forceLoadPlayer() {
            document.getElementById('countdownContainer').style.display = 'none';
            if (allStreams.length > 0) {
                playStream(allStreams[0]);
            }
        }

        (async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const sourcesParam = urlParams.get('sources');
            const sourceParam = urlParams.get('source');
            const idParam = urlParams.get('id');
            const title = urlParams.get('title');
            const matchDateParam = urlParams.get('date');

            if (title) {
                document.getElementById('streamTitle').innerText = title;
            }

            // Check if match is upcoming
            const matchTime = matchDateParam ? parseInt(matchDateParam, 10) : 0;
            const now = Date.now();

            if (matchTime > 0 && matchTime > now) {
                const countdownContainer = document.getElementById('countdownContainer');
                const liveClock = document.getElementById('liveClock');
                countdownContainer.style.display = 'flex';
                document.getElementById('loader').style.display = 'none';

                const updateClock = () => {
                    const diff = matchTime - Date.now();
                    if (diff <= 0) {
                        clearInterval(matchTimerInterval);
                        countdownContainer.style.display = 'none';
                        if (allStreams.length > 0) playStream(allStreams[0]);
                    } else {
                        const h = Math.floor(diff / (1000 * 60 * 60));
                        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                        const s = Math.floor((diff % (1000 * 60)) / 1000);
                        liveClock.innerText = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                    }
                };
                updateClock();
                matchTimerInterval = setInterval(updateClock, 1000);
            }

            let sources = [];
            if (sourcesParam) {
                try { sources = JSON.parse(sourcesParam); } catch(e){}
            } else if (sourceParam && idParam) {
                sources = [{ source: sourceParam, id: idParam }];
            }

            if (!sources || sources.length === 0) {
                showError("Invalid stream parameters.");
                return;
            }

            try {
                // Fetch all sources concurrently
                const fetchPromises = sources.map(async (src) => {
                    try {
                        const res = await fetchWithTimeout(`https://streamed.pk/api/stream/${src.source}/${src.id}`);
                        if (res.ok) return await res.json();
                        return [];
                    } catch (err) {
                        console.warn(`Failed to fetch source ${src.source}:`, err);
                        return [];
                    }
                });

                const results = await Promise.all(fetchPromises);
                
                // Flatten results and filter out empty ones
                results.forEach(resArr => {
                    if (Array.isArray(resArr)) {
                        allStreams.push(...resArr);
                    }
                });

                if (allStreams.length > 0) {
                    renderChannels();
                    // Auto-play only if match has already started or no date provided
                    if (!matchTime || matchTime <= Date.now()) {
                        playStream(allStreams[0]);
                    }
                } else if (!matchTime || matchTime <= Date.now()) {
                    showError("No streams are currently online for this match.");
                }
            } catch (err) {
                console.error("Stream fetch error:", err);
                if (!matchTime || matchTime <= Date.now()) {
                    showError("Could not connect to stream provider.");
                }
            }

            function renderChannels() {
                document.getElementById('btnToggleChannels').style.display = 'flex';
                document.getElementById('channelCount').innerText = allStreams.length;
                
                const list = document.getElementById('channelsList');
                list.innerHTML = '';
                
                allStreams.forEach((stream, index) => {
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    item.onclick = () => {
                        document.getElementById('countdownContainer').style.display = 'none';
                        playStream(stream);
                        toggleChannels(); // close panel on selection
                        
                        document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                        item.classList.add('active');
                    };
                    
                    const name = stream.language || `Stream ${stream.streamNo || (index + 1)}`;
                    const sourceLabel = stream.source ? `<span class="badge">${stream.source}</span>` : '';
                    const hdBadge = stream.hd ? `<span class="badge hd">HD</span>` : '';
                    
                    item.innerHTML = `
                        <div class="channel-name">${name}</div>
                        <div class="channel-meta">
                            ${hdBadge}
                            ${sourceLabel}
                            <span>CH ${stream.streamNo || (index + 1)}</span>
                        </div>
                    `;
                    list.appendChild(item);
                });
                
                if (list.firstChild) list.firstChild.classList.add('active');
            }
            
            function playStream(stream) {
                currentStreamUrl = stream.embedUrl;
                document.getElementById('loaderText').innerText = "Loading player...";
                document.getElementById('loader').style.display = 'flex';
                document.getElementById('errorMsg').style.display = 'none';
                
                const iframe = document.getElementById('playerFrame');
                iframe.onload = () => {
                    document.getElementById('loader').style.display = 'none';
                };
                iframe.src = stream.embedUrl;
            }

            function showError(msg) {
                document.getElementById('loader').style.display = 'none';
                const errEl = document.getElementById('errorMsg');
                errEl.innerText = msg;
                errEl.style.display = 'block';
            }
            
            // Fade out header when inactive to give full screen experience
            let timeout;
            const header = document.getElementById('header');
            
            function resetFade() {
                if (channelsPanel.classList.contains('open')) {
                    header.classList.remove('hidden');
                    clearTimeout(timeout);
                    return;
                }
                
                header.classList.remove('hidden');
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    if (!channelsPanel.classList.contains('open')) {
                        header.classList.add('hidden');
                    }
                }, 4000);
            }
            
            window.addEventListener('mousemove', resetFade);
            window.addEventListener('touchstart', resetFade);
            resetFade();
        })();
    </script>
</body>
</html>
